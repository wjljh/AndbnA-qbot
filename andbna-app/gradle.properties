# 内存上限压到 1G：这台 15G 无 swap 的机器在 2G 堆 + 多任务时会被 OOM 打死（已发生两次卡死重启）
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=1
# 并行关掉：Chaquopy 会在执行期操作 Kotlin 任务的属性（friendPathsSet），
# 和并行调度抢状态锁，会报 "Current thread does not hold the state lock"。
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 8.7 官方只认到 SDK 35，而 Miuix 需要 37。
# 平台是真装的（android.jar 存在），只是 AGP 不认识这个版本号，把这个告知压掉。
android.suppressUnsupportedCompileSdk=37

# 本机 JDK21（无 sudo，Adoptium tar.gz 解到 ~/toolchain）
org.gradle.java.home=/home/wjljh/toolchain/jdk21
