name: update-latest-json

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 拉取最新 Release 元数据
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs
          gh api repos/${{ github.repository }}/releases/latest \
            --jq '{tag_name: .tag_name, name: .name, body: .body,
                   assets: [.assets[] | {name: .name, size: .size, browser_download_url: .browser_download_url}],
                   published_at: .published_at}' > docs/latest.json
          echo '--- docs/latest.json ---'
          head -c 600 docs/latest.json
      - name: 提交变更
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json
          git diff --cached --quiet && echo '无变化，跳过' || git commit -m 'chore: 更新 docs/latest.json（${GITHUB_REF_NAME}）'
          git push
